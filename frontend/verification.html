<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Verification | Perishable Stock</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #f7f5ff,
                #eef2ff,
                #f8faff
            );
            min-height: 100vh;
            color: #1e1b4b;
        }


        /* TOP BAR */

        .topbar {
            height: 76px;
            background: linear-gradient(
                135deg,
                #4c1d95,
                #312e81,
                #2563eb
            );
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
            box-shadow: 0 5px 20px rgba(49, 46, 129, 0.25);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .brand-text h2 {
            margin: 0;
            font-size: 20px;
        }

        .brand-text p {
            margin: 3px 0 0;
            font-size: 12px;
            opacity: 0.8;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.25s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.25);
        }


        /* MAIN */

        .page-wrapper {
            width: 92%;
            max-width: 1050px;
            margin: 38px auto 60px;
        }


        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin: 0;
            font-size: 30px;
            color: #312e81;
        }

        .page-heading p {
            margin: 7px 0 0;
            color: #64748b;
            font-size: 14px;
        }


        /* VERIFICATION CARD */

        .verification-card {
            background: white;
            border-radius: 22px;
            padding: 30px;
            border: 1px solid #e5e7eb;
            box-shadow:
                0 12px 35px rgba(49, 46, 129, 0.10);
        }


        /* SECTION TITLE */

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 25px;
        }

        .section-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #ede9fe,
                #dbeafe
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 19px;
            color: #312e81;
        }


        /* SELECT */

        .select-label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 600;
            color: #3730a3;
        }

        .select-wrapper {
            position: relative;
        }

        #productSelect {
            width: 100%;
            height: 50px;
            border: 1px solid #dbe1ea;
            border-radius: 11px;
            padding: 0 15px;
            font-size: 14px;
            color: #1e293b;
            background: white;
            outline: none;
            cursor: pointer;
            transition: 0.25s;
        }

        #productSelect:focus {
            border-color: #6366f1;
            box-shadow:
                0 0 0 3px rgba(99,102,241,0.12);
        }


        /* VERIFY BUTTON */

        .verify-btn {
            width: 100%;
            margin-top: 18px;
            height: 50px;
            border: none;
            border-radius: 11px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(
                135deg,
                #7c3aed,
                #4f46e5,
                #2563eb
            );
            box-shadow:
                0 7px 18px rgba(79,70,229,0.25);
            transition: 0.25s;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 24px rgba(79,70,229,0.32);
        }


        /* RESULT */

        #result {
            margin-top: 28px;
        }

        .result-card {
            border: 1px solid #e5e7eb;
            border-radius: 17px;
            overflow: hidden;
            background: white;
        }

        .result-header {
            padding: 18px 22px;
            background: linear-gradient(
                135deg,
                #f5f3ff,
                #eff6ff
            );
            border-bottom: 1px solid #ddd6fe;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-header h2 {
            margin: 0;
            color: #312e81;
            font-size: 18px;
        }


        /* RESULT GRID */

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 22px;
        }

        .result-item {
            padding: 15px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #eef0f5;
        }

        .result-label {
            display: block;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .result-value {
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }


        /* OVERALL */

        .overall-box {
            margin: 0 22px 22px;
            padding: 18px;
            border-radius: 13px;
            background: linear-gradient(
                135deg,
                #ede9fe,
                #dbeafe
            );
            border: 1px solid #c4b5fd;
        }

        .overall-title {
            font-size: 11px;
            color: #4338ca;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .overall-status {
            font-size: 20px;
            font-weight: 800;
            color: #312e81;
        }


        /* PRIORITY */

        .priority-box {
            margin: 0 22px 22px;
            padding: 16px;
            border-radius: 12px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
        }

        .priority-title {
            font-size: 11px;
            color: #c2410c;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .priority-value {
            font-size: 16px;
            font-weight: 700;
            color: #9a3412;
        }


        /* ACTION */

        .action-box {
            margin: 0 22px 22px;
            padding: 17px;
            border-radius: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .action-title {
            font-size: 11px;
            color: #15803d;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .action-value {
            font-size: 16px;
            font-weight: 700;
            color: #166534;
        }


        /* ERROR */

        .error-message {
            padding: 18px;
            border-radius: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            font-weight: 600;
        }


        /* INFO */

        .info-box {
            margin-top: 20px;
            padding: 14px 17px;
            border-radius: 11px;
            background: linear-gradient(
                135deg,
                #f5f3ff,
                #eff6ff
            );
            border: 1px solid #ddd6fe;
            color: #4338ca;
            font-size: 12px;
            line-height: 1.6;
        }


        /* RESPONSIVE */

        @media (max-width: 700px) {

            .topbar {
                padding: 0 18px;
            }

            .brand-text h2 {
                font-size: 16px;
            }

            .page-wrapper {
                width: 94%;
            }

            .verification-card {
                padding: 20px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- TOP BAR -->

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            🔍
        </div>

        <div class="brand-text">

            <h2>Perishable Stock</h2>

            <p>Verification System</p>

        </div>

    </div>


    <button class="back-btn"
            onclick="goDashboard()">

        ← Dashboard

    </button>

</header>



<!-- MAIN -->

<main class="page-wrapper">


    <div class="page-heading">

        <h1>
            Product Verification
        </h1>

        <p>
            Verify product expiry, quantity, storage and record conditions.
        </p>

    </div>



    <div class="verification-card">


        <!-- SECTION -->

        <div class="section-title">

            <div class="section-icon">
                🔍
            </div>

            <h2>
                Select Product to Verify
            </h2>

        </div>



        <label class="select-label"
               for="productSelect">

            📦 Select Product

        </label>


        <div class="select-wrapper">

            <select id="productSelect">

                <option value="">
                    Loading products...
                </option>

            </select>

        </div>



        <button class="verify-btn"
                onclick="verifyProduct()">

            🔎 Verify Product

        </button>



        <!-- RESULT -->

        <div id="result"></div>



        <div class="info-box">

            💡 <strong>Verification checks:</strong>
            expiry date, quantity, storage condition,
            record completeness and date validity.

        </div>


    </div>


</main>



<script>


let products = [];



// LOAD PRODUCTS

fetch("../backend/get_products.php")

.then(response => response.json())

.then(data => {

    products = data;

    const select =
        document.getElementById(
            "productSelect"
        );


    select.innerHTML =
        '<option value="">Select Product</option>';


    products.forEach(product => {

        const option =
            document.createElement("option");


        option.value =
            product.product_id;


        option.textContent =
            product.product_name +
            " - Quantity: " +
            product.quantity;


        select.appendChild(option);

    });

})


.catch(error => {

    console.error(error);

    document.getElementById(
        "productSelect"
    ).innerHTML =
        '<option value="">Unable to load products</option>';

});



// VERIFY PRODUCT

function verifyProduct() {


    const productId =
        document.getElementById(
            "productSelect"
        ).value;


    if (!productId) {

        alert(
            "Please select a product."
        );

        return;

    }


    const data =
        new URLSearchParams();


    data.append(
        "product_id",
        productId
    );



    fetch(
        "../backend/verify_product.php",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/x-www-form-urlencoded"

            },

            body: data

        }

    )


    .then(response =>
        response.json()
    )


    .then(result => {


        if (!result.success) {

            document.getElementById(
                "result"
            ).innerHTML = `

                <div class="error-message">

                    ❌ ${result.message}

                </div>

            `;

            return;

        }



        document.getElementById(
            "result"
        ).innerHTML = `

            <div class="result-card">


                <div class="result-header">

                    <span>📊</span>

                    <h2>
                        Verification Result
                    </h2>

                </div>



                <div class="result-grid">


                    <div class="result-item">

                        <span class="result-label">
                            Days Left
                        </span>

                        <span class="result-value">
                            ${result.days_left}
                        </span>

                    </div>


                    <div class="result-item">

                        <span class="result-label">
                            Expiry Status
                        </span>

                        <span class="result-value">
                            ${result.expiry_status}
                        </span>

                    </div>


                    <div class="result-item">

                        <span class="result-label">
                            Quantity Status
                        </span>

                        <span class="result-value">
                            ${result.quantity_status}
                        </span>

                    </div>


                    <div class="result-item">

                        <span class="result-label">
                            Storage Status
                        </span>

                        <span class="result-value">
                            ${result.storage_status}
                        </span>

                    </div>


                    <div class="result-item">

                        <span class="result-label">
                            Record Status
                        </span>

                        <span class="result-value">
                            ${result.record_status}
                        </span>

                    </div>


                    <div class="result-item">

                        <span class="result-label">
                            Date Status
                        </span>

                        <span class="result-value">
                            ${result.date_status}
                        </span>

                    </div>


                </div>



                <div class="overall-box">

                    <div class="overall-title">
                        Overall Status
                    </div>

                    <div class="overall-status">
                        ${result.overall_status}
                    </div>

                </div>



                <div class="priority-box">

                    <div class="priority-title">
                        Priority
                    </div>

                    <div class="priority-value">
                        🚦 ${result.priority}
                    </div>

                </div>



                <div class="action-box">

                    <div class="action-title">
                        Recommended Action
                    </div>

                    <div class="action-value">
                        💡 ${result.action}
                    </div>

                </div>


            </div>

        `;

    })


    .catch(error => {

        console.error(error);

        document.getElementById(
            "result"
        ).innerHTML = `

            <div class="error-message">

                ❌ Server connection error.

            </div>

        `;

    });

}



// DASHBOARD

function goDashboard() {

    window.location.href =
        "dashboard.html";

}

</script>


</body>

</html>
